<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#030303">
<title>ماركت أم القرى</title>
<style>
:root{--gold:#f6c85f;--pale:#fff1bc}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030303;color:#fff;font-family:Tahoma,Arial,sans-serif}body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 48%,#171108 0%,#080705 42%,#020202 78%)}.backdrop{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 8%,#ffffff04 8.1% 8.25%,transparent 8.35% 16%)}.halo{position:absolute;width:78vmin;height:78vmin;border:1px solid #f6c85f38;border-radius:50%;box-shadow:0 0 40px #e7a92720,inset 0 0 50px #e7a92712;animation:rotate 35s linear infinite}.halo:before,.halo:after{content:"";position:absolute;inset:8%;border:1px solid #f6c85f25;border-radius:50%}.halo:after{inset:17%;border-color:#fff1bc20}.edge{position:absolute;inset:3.5%;border:1px solid #dba83c66;box-shadow:inset 0 0 25px #e4ad3920,0 0 18px #e4ad3915}.edge:before{content:"";position:absolute;inset:9px;border:1px solid #f6c85f20}.corner{position:absolute;width:9vw;height:9vw;max-width:120px;max-height:120px;border-color:var(--gold);border-style:solid;filter:drop-shadow(0 0 8px #f6c85f66)}.tl{top:3.5%;left:3.5%;border-width:2px 0 0 2px}.tr{top:3.5%;right:3.5%;border-width:2px 2px 0 0}.bl{bottom:3.5%;left:3.5%;border-width:0 0 2px 2px}.br{bottom:3.5%;right:3.5%;border-width:0 2px 2px 0}.beam{position:absolute;top:0;left:-45%;width:32%;height:100%;transform:skewX(-18deg);background:linear-gradient(90deg,transparent,#f6c85f0b,#ffdf8529,transparent);animation:beam 8s ease-in-out infinite}.content{position:relative;width:min(92vw,145vh);text-align:center;padding:3vh 4vw;animation:enter 1.5s ease both}.cart{font-size:clamp(42px,7vw,94px);line-height:1;margin-bottom:1vh;color:var(--pale);filter:drop-shadow(0 0 14px #f5bd3b99);animation:float 4s ease-in-out infinite}.eyebrow{font-size:clamp(16px,2vw,30px);color:#fff1c5;text-shadow:0 0 16px #d9a63a66}h1{margin:1vh 0 2.5vh;font-size:clamp(48px,10vw,150px);font-weight:900;line-height:1.3;letter-spacing:-.04em;background:linear-gradient(180deg,#fffbe5 0%,#ffe49a 27%,#e7ad32 58%,#fff0b4 75%,#9b6718 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px #ffebac;filter:drop-shadow(0 5px 0 #4b3009) drop-shadow(0 0 20px #d99a1f66);animation:shine 5s ease-in-out infinite}.divider{height:2px;width:54%;margin:0 auto 3vh;background:linear-gradient(90deg,transparent,#a8731e,#fff1b4,#d9a12d,transparent);box-shadow:0 0 12px #e5b345;animation:pulse 3s ease-in-out infinite}.hours{display:inline-flex;flex-direction:column;align-items:center;gap:1vh;min-width:min(76vw,850px);padding:2vh 4vw;border:1px solid #d9ad4c;border-radius:22px;background:linear-gradient(145deg,#0a0906f5,#050505f8);box-shadow:0 0 25px #c78c241f,inset 0 0 25px #e2b3440d;position:relative;overflow:hidden}.hours:before{content:"";position:absolute;top:0;bottom:0;left:-35%;width:25%;background:linear-gradient(90deg,transparent,#fff0b31c,transparent);transform:skewX(-20deg);animation:beam 6s ease-in-out infinite}.label{font-size:clamp(20px,3vw,42px);font-weight:bold;color:#fff3ce}.clock{display:inline-block;color:var(--gold);animation:tick 2s ease-in-out infinite}.time{font-size:clamp(25px,4.4vw,64px);font-weight:900;white-space:nowrap;color:#fff}.time strong{color:var(--pale);text-shadow:0 0 16px #dca52d55}.spark{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff1b4;box-shadow:0 0 14px 4px #e7b444;animation:twinkle 3s ease-in-out infinite}.s1{top:19%;right:18%}.s2{top:28%;left:17%;animation-delay:1s}.s3{bottom:19%;right:20%;animation-delay:1.8s}.s4{bottom:24%;left:19%;animation-delay:.5s}@keyframes rotate{to{transform:rotate(360deg)}}@keyframes beam{0%,100%{left:-45%;opacity:0}35%,65%{opacity:1}55%{left:110%}}@keyframes enter{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes shine{0%,100%{filter:drop-shadow(0 5px 0 #4b3009) drop-shadow(0 0 15px #d99a1f44)}50%{filter:drop-shadow(0 5px 0 #4b3009) drop-shadow(0 0 30px #ffe08a99)}}@keyframes pulse{0%,100%{opacity:.6;transform:scaleX(.8)}50%{opacity:1;transform:scaleX(1)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes tick{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.3)}}@media(orientation:portrait){.content{width:94vw;padding:2vh 2vw}.time{white-space:normal}.hours{min-width:86vw}.halo{width:110vw;height:110vw}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body><div class="backdrop"></div><div class="halo"></div><div class="beam"></div><div class="edge"></div><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div><div class="spark s1"></div><div class="spark s2"></div><div class="spark s3"></div><div class="spark s4"></div>
<main class="content"><div class="cart" aria-hidden="true">🛒</div><div class="eyebrow">أهلاً وسهلاً بكم</div><h1>ماركت أم القرى</h1><div class="divider"></div><section class="hours"><div class="label"><span class="clock">◷</span> أوقات الدوام</div><div class="time">من <strong>8 صباحاً</strong> إلى <strong>1 ليلاً</strong></div></section></main>
<script>function goFull(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});}document.addEventListener('keydown',e=>{if(['f','F','Enter'].includes(e.key))goFull()});document.addEventListener('click',goFull,{once:true});</script></body></html>
